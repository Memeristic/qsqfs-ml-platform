# ============================================================================
# QSQ-FS ML Platform - default configuration
# Every value here is a knob, not a result. Nothing in this file encodes an
# expected accuracy, RMSE, or any other outcome.
# ============================================================================

preprocessing:
  impute_strategy: median        # mean | median | most_frequent | constant
  scaler: standard               # standard | minmax | robust | none
  encode_categorical: true
  max_categories: 30             # rare levels are grouped, to bound one-hot width

feature_selection:
  qsqfs:
    n_iterations: 40             # generations
    population_size: 30          # colonies
    alpha: 0.85                  # predictive score vs parsimony (1.0 = ignore size)
    w_ai: 0.5                    # autoinducer sensing weight
    beta: 0.7                    # EMA smoothing of the field across generations
    delta: 0.97                  # per-generation decay of archive penalties
    min_fraction: 0.05           # smallest allowed subset, as a fraction of features
    max_fraction: 0.5            # largest allowed subset
    stagnation_window: 12        # generations without gain before diversity injection
    diversity_injection_rate: 0.25
    early_stop_patience: null    # e.g. 15 to stop early; null runs all generations
    estimator: knn               # knn (fast) | forest (slower, less myopic)
    cv_folds: 5                  # inner CV used to score a mask
    use_quorum_sensing: true
    use_quorum_quenching: true
    use_elitism: true
    use_cache: true
    n_jobs: 1                    # parallel folds inside mask evaluation

models:
  transformer:
    embedding_dim: 64            # must be divisible by n_heads
    n_heads: 4
    n_layers: 3
    dropout: 0.1
    use_cls_token: true
    batch_size: 64
    epochs: 100
    early_stopping_patience: 10
    learning_rate: 0.001
    weight_decay: 0.0001
    val_split: 0.2
  # Baselines are chosen automatically for the task. Classification gets
  # dummy_majority / logistic_regression / svm / random_forest /
  # hist_gradient_boosting; regression gets dummy_mean / ridge / svm /
  # random_forest / hist_gradient_boosting. Leave null for all of them.
  baselines: null
  n_permutations: 15             # repeats for permutation importance

evaluation:
  cv_type: null                  # time_series | group | stratified | random
                                 # null lets the command pick a sensible default
  n_folds: 5
  test_size: 0.2
  gap: 0                         # rows held out between train and test (time series)
  bootstrap_iterations: 1000
  confidence_level: 0.95

output:
  results_dir: ./run_results
  figure_format: png
